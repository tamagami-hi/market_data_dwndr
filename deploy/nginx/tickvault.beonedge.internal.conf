# TickVault — same-origin reverse proxy (LAN)
#
# Install as:  /etc/nginx/sites-available/tickvault
# Enable with: ln -s /etc/nginx/sites-available/tickvault /etc/nginx/sites-enabled/tickvault
# Then:        sudo nginx -t && sudo systemctl reload nginx
#
# WHAT THIS DOES
# One hostname serves both apps. nginx inspects the request PATH and forwards:
#     /api/*  -> backend  (127.0.0.1:9000)
#     /ws/*   -> backend  (127.0.0.1:9000, WebSocket upgrade)
#     /       -> frontend (127.0.0.1:3789)   pages, /_next/*, /login, /monitor
# The browser only ever sees ONE origin (http://tickvault.beonedge.internal), so there
# is no CORS and the backend needs no reachable address of its own.
#
# WHY 127.0.0.1 WORKS HERE
# nginx runs on the HOST (not in a container), and the app containers publish their
# ports to 127.0.0.1. Host loopback is therefore the correct, already-available path to
# both services — no Docker network attachment and no container-name DNS needed. It also
# leaves `curl http://localhost:9000/health` on the box working exactly as before.

# ---------------------------------------------------------------------------
# WebSocket upgrade helper (http context — a `map` cannot live inside `server`).
#
# A WebSocket handshake is an HTTP request carrying `Upgrade: websocket`. A proxy must
# forward that header AND set `Connection: upgrade`. But `Connection` must be `close`
# for ordinary requests, so we derive it from whether $http_upgrade was present.
# Hardcoding `Connection "upgrade"` on every request is a common mistake.
# ---------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Named upstreams: one place to change a port, and a clear name in the config below.
#
# NOTE on `keepalive`: it only takes effect when the proxied request uses HTTP/1.1 AND
# the `Connection` header sent upstream is cleared. Without `proxy_set_header Connection
# ""` in each proxying location, nginx sends `Connection: close` and this directive is
# silently inert — a new TCP handshake per request. See the locations below.
upstream tickvault_frontend {
    server 127.0.0.1:3789;
    keepalive 16;
}

upstream tickvault_backend {
    server 127.0.0.1:9000;
    keepalive 16;
}

server {
    # LISTEN ADDRESS vs UPSTREAM ADDRESS — do not confuse these:
    #
    #   `listen 80` binds 0.0.0.0:80, i.e. EVERY interface on the box. That already
    #   includes the LAN IP 192.168.29.2, so no explicit IP is needed here for phones
    #   and laptops to reach nginx.
    #
    #   Do NOT narrow this to `listen 192.168.29.2:80`. The Cloudflare tunnel
    #   (cloudflared) connects to `http://localhost:80`, so binding only the LAN
    #   address would break the tunnelled site sharing this nginx.
    #
    #   The 127.0.0.1 addresses in the upstreams above are the OPPOSITE end of the
    #   hop — where nginx forwards to, not where it accepts connections.
    listen 80;
    listen [::]:80;

    # nginx picks a server block by matching this against the request's Host header.
    # It is NOT marked default_server, so requests with an unknown Host keep falling
    # through to whatever default already exists on this box (the alphabetically-first
    # site in sites-enabled). That also means this vhost is only reachable by NAME.
    #
    # INTERNET EXPOSURE: none. The Cloudflare tunnel on this host forwards only
    # `beus.beonedge.in` and answers everything else with http_status:404 inside
    # cloudflared, so requests for this hostname never arrive from the internet — and
    # `.internal` cannot be a public DNS name anyway. This vhost is LAN-only, which
    # matters because the API behind it has no authentication layer.
    server_name tickvault.beonedge.internal;

    # Don't advertise the nginx version in responses and error pages.
    # (Set this in nginx.conf's http block to cover every vhost on the box.)
    server_tokens off;

    # Reasonable logs while learning: check these first when something 502s.
    # Note: uvicorn emits a lowercase duplicate `date` header on the WebSocket
    # handshake, so expect one benign warning per WS connection here.
    access_log /var/log/nginx/tickvault.access.log;
    error_log  /var/log/nginx/tickvault.error.log warn;

    # Compression. `gzip_proxied` is REQUIRED here: nginx's default is `off`, which
    # means proxied responses are never compressed — and every response in this vhost
    # is proxied, so `gzip on` alone would do nothing. Mainly benefits the backend's
    # JSON (Next.js already compresses its own responses).
    gzip on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # Response hardening. `add_header` follows the same replace-not-merge inheritance
    # rule as proxy_set_header, so `always` + server-level placement keeps them on
    # error responses too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Shared proxy headers. Without these the backend sees nginx as the client and
    # cannot reconstruct the original request. `Host` in particular must be preserved:
    # the backend's WebSocket/CORS check compares the browser's Origin against
    # FRONTEND_URL, so the original host has to survive the hop.
    #
    # INHERITANCE TRAP: proxy_set_header REPLACES the whole inherited set. Any location
    # that declares its own proxy_set_header loses every one of these — which is why
    # /ws/ below re-declares them explicitly instead of relying on inheritance.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -----------------------------------------------------------------------
    # Backend REST API
    #
    # TRAILING-SLASH RULE (the classic nginx gotcha):
    #   proxy_pass http://upstream;     <- no URI part: the ORIGINAL path is passed
    #                                      through unchanged (/api/stats -> /api/stats)
    #   proxy_pass http://upstream/;    <- has a URI ("/"): nginx REPLACES the matched
    #                                      location prefix (/api/stats -> /stats)
    # The backend's routes really are /api/..., so we must NOT strip the prefix.
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://tickvault_backend;

        # Re-declare the shared headers (see INHERITANCE TRAP above) and clear
        # `Connection` so the upstream `keepalive` pool is actually used.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
    }

    # -----------------------------------------------------------------------
    # Backend WebSocket topics (/ws/market-data, /ws/capture-status, ...)
    # -----------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://tickvault_backend;

        # Must repeat the shared headers: declaring Upgrade/Connection here would
        # otherwise drop Host and the X-Forwarded-* set for every WS connection
        # (the backend would log nginx as the client, and any future Host-based
        # check would fail).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The two headers that make an upgrade work. Omit them and the handshake
        # silently degrades to a normal request: the UI shows endless reconnects.
        # NOTE: Connection must be $connection_upgrade here, NOT "" — an upgraded
        # connection is not a keepalive-pooled one.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A WebSocket is idle between pushes; the 60s default read timeout would cut
        # it. The feed pushes ~1/s, but keep generous margins for quiet periods.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Never buffer a live stream — deliver frames as they arrive.
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # Immutable Next.js build assets: the filenames carry a content hash, so they
    # can be cached indefinitely. Worth it on a phone reload over Wi-Fi.
    # -----------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://tickvault_frontend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_read_timeout 60s;
    }

    # -----------------------------------------------------------------------
    # Everything else -> the Next.js frontend.
    #
    # NOTE: /monitor is intentionally NOT routed to the backend. The backend also
    # serves a /monitor HTML page, but the frontend owns that route here; sending it
    # upstream would shadow the real dashboard.
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://tickvault_frontend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
    }
}
