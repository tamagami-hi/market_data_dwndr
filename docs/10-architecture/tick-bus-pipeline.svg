<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Tick bus and algo engine pipeline</title>
  <desc>Kite ticks fan out at the broker callback: raw bytes go to a ZeroMQ PUB socket for the
  Rust algo engine (may drop by design), while the parsed path stays in-process through the 1 Hz
  grid to disk and to the frontend. The archive is never a bus subscriber.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowSafe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1180" height="720" fill="#0b0f14"/>

  <text x="28" y="40" fill="#e2e8f0" font-size="21" font-weight="600">
    Tick bus and algo engine — fan-out at the source
  </text>
  <text x="28" y="63" fill="#7c8899" font-size="13">
    Two independent consumers of one callback. The archive path never depends on the bus.
  </text>

  <!-- ================= broker ================= -->
  <rect x="28" y="92" width="250" height="120" rx="10" fill="#111826" stroke="#334155"/>
  <text x="44" y="117" fill="#9fb3c8" font-size="11" letter-spacing="1">BROKER FEED</text>
  <text x="44" y="141" fill="#e2e8f0" font-size="14" font-weight="600">KiteTicker</text>
  <text x="44" y="162" fill="#7c8899" font-size="11.5">background thread</text>
  <text x="44" y="180" fill="#7c8899" font-size="11.5">_on_message(payload, is_binary)</text>
  <text x="44" y="198" fill="#f59e0b" font-size="11.5">raw binary, unparsed</text>

  <!-- split marker -->
  <circle cx="300" cy="152" r="5" fill="#94a3b8"/>
  <line x1="278" y1="152" x2="300" y2="152" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="292" y="138" fill="#7c8899" font-size="10.5">fan-out</text>

  <!-- ================= ALGO PATH (top) ================= -->
  <line x1="300" y1="152" x2="300" y2="112" stroke="#f59e0b" stroke-width="1.8"/>
  <line x1="300" y1="112" x2="372" y2="112" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="376" y="80" width="228" height="104" rx="10" fill="#1c1508" stroke="#f59e0b"/>
  <text x="392" y="104" fill="#f59e0b" font-size="11" letter-spacing="1">PRIORITY 1 · EVERY TICK</text>
  <text x="392" y="127" fill="#e2e8f0" font-size="13.5" font-weight="600">ZMQ PUB · ipc://</text>
  <text x="392" y="147" fill="#9fb3c8" font-size="11.5">send(bytes, DONTWAIT)</text>
  <text x="392" y="165" fill="#9fb3c8" font-size="11.5">seq + ns timestamp</text>

  <line x1="604" y1="132" x2="668" y2="132" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrowHot)"/>
  <text x="608" y="122" fill="#f59e0b" font-size="10">may drop</text>
  <text x="608" y="152" fill="#7c8899" font-size="10">(by design)</text>

  <rect x="672" y="72" width="272" height="122" rx="10" fill="#111826" stroke="#f59e0b"/>
  <text x="688" y="96" fill="#f59e0b" font-size="11" letter-spacing="1">RUST ALGO ENGINE</text>
  <text x="688" y="119" fill="#e2e8f0" font-size="13.5" font-weight="600">parse Kite binary natively</text>
  <text x="688" y="139" fill="#9fb3c8" font-size="11.5">IV + Greeks — implied-vol (LBR)</text>
  <text x="688" y="157" fill="#9fb3c8" font-size="11.5">strategy evaluation</text>
  <text x="688" y="175" fill="#9fb3c8" font-size="11.5">order placement</text>

  <line x1="944" y1="133" x2="1000" y2="133" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="1004" y="104" width="148" height="58" rx="9" fill="#111826" stroke="#334155"/>
  <text x="1018" y="128" fill="#e2e8f0" font-size="12.5" font-weight="600">Kite orders API</text>
  <text x="1018" y="147" fill="#7c8899" font-size="11">~50–100 ms WAN</text>

  <!-- session header topic -->
  <rect x="376" y="200" width="228" height="66" rx="9" fill="#111826" stroke="#475569" stroke-dasharray="4 3"/>
  <text x="392" y="222" fill="#9fb3c8" font-size="11" letter-spacing="1">TOPIC: SESSION HEADER</text>
  <text x="392" y="243" fill="#7c8899" font-size="11.5">token → underlying / expiry /</text>
  <text x="392" y="259" fill="#7c8899" font-size="11.5">strike / side · republished</text>
  <line x1="604" y1="228" x2="672" y2="200" stroke="#475569" stroke-width="1.4"
        stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ================= ARCHIVE PATH (bottom) ================= -->
  <line x1="300" y1="152" x2="300" y2="343" stroke="#22c55e" stroke-width="1.8"/>
  <line x1="300" y1="343" x2="372" y2="343" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrowSafe)"/>

  <rect x="376" y="284" width="228" height="118" rx="10" fill="#0d1a12" stroke="#22c55e"/>
  <text x="392" y="306" fill="#22c55e" font-size="11" letter-spacing="1">PRIORITY 2 · 1 Hz GRID</text>
  <text x="392" y="328" fill="#e2e8f0" font-size="13" font-weight="600">on_ticks → list[dict]</text>
  <text x="392" y="347" fill="#9fb3c8" font-size="11.5">call_soon_threadsafe → queue</text>
  <text x="392" y="365" fill="#e2e8f0" font-size="12.5" font-weight="600">apply_ticks → 1 Hz snapshot</text>
  <text x="392" y="383" fill="#22c55e" font-size="11.5">in-process · never drops</text>

  <!-- to disk -->
  <line x1="490" y1="402" x2="490" y2="440" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrowSafe)"/>
  <rect x="376" y="444" width="228" height="86" rx="10" fill="#0d1a12" stroke="#22c55e"/>
  <text x="392" y="468" fill="#22c55e" font-size="11" letter-spacing="1">DATA SAVER</text>
  <text x="392" y="490" fill="#e2e8f0" font-size="13" font-weight="600">writer thread → .bin</text>
  <text x="392" y="510" fill="#7c8899" font-size="11.5">fsync per frame · raw ints only</text>

  <!-- to greeks -->
  <line x1="604" y1="343" x2="668" y2="343" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="672" y="300" width="272" height="94" rx="10" fill="#111826" stroke="#334155"/>
  <text x="688" y="324" fill="#9fb3c8" font-size="11" letter-spacing="1">DISPLAY RECONSTRUCTION</text>
  <text x="688" y="346" fill="#e2e8f0" font-size="13" font-weight="600">py_vollib IV + Greeks</text>
  <text x="688" y="366" fill="#7c8899" font-size="11.5">Let's Be Rational — matches Rust</text>
  <text x="688" y="384" fill="#7c8899" font-size="11.5">Greeks are never persisted</text>

  <line x1="944" y1="347" x2="1000" y2="347" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="1004" y="318" width="148" height="58" rx="9" fill="#111826" stroke="#334155"/>
  <text x="1018" y="342" fill="#e2e8f0" font-size="12.5" font-weight="600">TickVault UI</text>
  <text x="1018" y="361" fill="#7c8899" font-size="11">WS · same origin</text>

  <!-- ================= the rule ================= -->
  <rect x="28" y="560" width="546" height="132" rx="10" fill="#1a1013" stroke="#7f1d1d"/>
  <text x="44" y="584" fill="#f87171" font-size="11" letter-spacing="1">THE RULE</text>
  <text x="44" y="608" fill="#e2e8f0" font-size="12.5">The archive is NOT a bus subscriber.</text>
  <text x="44" y="629" fill="#9fb3c8" font-size="11.5">ZMQ PUB discards at the high-water mark — right for a trading</text>
  <text x="44" y="646" fill="#9fb3c8" font-size="11.5">engine (a stale tick is worthless), fatal for an archive whose</text>
  <text x="44" y="663" fill="#9fb3c8" font-size="11.5">purpose is completeness. Fan out at the source so the disk path</text>
  <text x="44" y="680" fill="#9fb3c8" font-size="11.5">keeps today's guarantee: session_loss_pct ≈ 0.24%.</text>

  <!-- ================= measured cost ================= -->
  <rect x="596" y="560" width="556" height="132" rx="10" fill="#111826" stroke="#334155"/>
  <text x="612" y="584" fill="#9fb3c8" font-size="11" letter-spacing="1">MEASURED PER SECOND (2026-07-29)</text>
  <text x="612" y="607" fill="#e2e8f0" font-size="11.5">Greeks, 4 chains, real frames</text>
  <text x="1090" y="607" fill="#e2e8f0" font-size="11.5" text-anchor="end">16.0 ms</text>
  <text x="612" y="626" fill="#9fb3c8" font-size="11.5">JSON encode (options + stocks)</text>
  <text x="1090" y="626" fill="#9fb3c8" font-size="11.5" text-anchor="end">8.9 ms</text>
  <text x="612" y="645" fill="#f59e0b" font-size="11.5">deflate — PER CLIENT connection</text>
  <text x="1090" y="645" fill="#f59e0b" font-size="11.5" text-anchor="end">21.2 ms</text>
  <line x1="612" y1="654" x2="1090" y2="654" stroke="#334155"/>
  <text x="612" y="672" fill="#e2e8f0" font-size="11.5">one browser tab / two tabs</text>
  <text x="1090" y="672" fill="#e2e8f0" font-size="11.5" text-anchor="end">47.2 / 68.4 ms</text>
  <text x="612" y="688" fill="#7c8899" font-size="10.5">Encode + compression cost more than the Greeks do.</text>
</svg>
