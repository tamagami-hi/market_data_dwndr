<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1080" width="1560" height="1080"
     font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="aLan" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#22c55e"/>
    </marker>
    <marker id="aTs" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#38bdf8"/>
    </marker>
    <marker id="aCf" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#f59e0b"/>
    </marker>
    <marker id="aSsh" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#a78bfa"/>
    </marker>
    <marker id="aInt" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#e4e4e7"/>
    </marker>
    <marker id="aUp" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#71717a"/>
    </marker>
  </defs>

  <rect width="1560" height="1080" fill="#09090b"/>

  <!-- ================= title ================= -->
  <text x="40" y="46" fill="#f4f4f5" font-size="26" font-weight="700">TickVault — how a request actually reaches the app</text>
  <text x="40" y="72" fill="#a1a1aa" font-size="14">
    Four independent ways in. All of them converge on ONE nginx front door, which routes by URL path.
  </text>

  <!-- ================= column headers ================= -->
  <text x="40"   y="120" fill="#71717a" font-size="12" font-weight="700" letter-spacing="1.5">1 · CLIENT</text>
  <text x="330"  y="120" fill="#71717a" font-size="12" font-weight="700" letter-spacing="1.5">2 · HOW IT FINDS / REACHES THE BOX</text>
  <text x="800"  y="120" fill="#71717a" font-size="12" font-weight="700" letter-spacing="1.5">3 · THE ONE FRONT DOOR</text>
  <text x="1240" y="120" fill="#71717a" font-size="12" font-weight="700" letter-spacing="1.5">4 · THE APPS</text>

  <!-- ================= the VPS boundary ================= -->
  <rect x="300" y="140" width="1220" height="700" rx="14" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="316" y="164" fill="#52525b" font-size="12" font-weight="700">
    VPS  “beonedge-vps”   ·   LAN 192.168.29.2   ·   Tailscale 100.122.85.101   ·   loopback 127.0.0.1
  </text>

  <!-- ================= PATH A: company LAN ================= -->
  <g>
    <rect x="40" y="185" width="230" height="86" rx="10" fill="#0f2417" stroke="#22c55e" stroke-width="1.6"/>
    <text x="56" y="212" fill="#dcfce7" font-size="15" font-weight="700">Phone / laptop</text>
    <text x="56" y="234" fill="#86efac" font-size="12">on the company Wi-Fi</text>
    <text x="56" y="254" fill="#4ade80" font-size="11" font-family="monospace">192.168.29.x</text>

    <!-- AdGuard -->
    <rect x="340" y="185" width="300" height="120" rx="10" fill="#0f2417" stroke="#22c55e" stroke-width="1.6"/>
    <text x="356" y="210" fill="#dcfce7" font-size="14" font-weight="700">AdGuard Home  ·  container</text>
    <text x="356" y="231" fill="#86efac" font-size="11.5" font-family="monospace">listens 192.168.29.2 : 53  (udp+tcp)</text>
    <text x="356" y="253" fill="#a1a1aa" font-size="11.5">DNS rewrite rule:</text>
    <text x="356" y="272" fill="#4ade80" font-size="11.5" font-family="monospace">*.beonedge.internal → 192.168.29.2</text>
    <text x="356" y="293" fill="#71717a" font-size="10.5">everything else → forwarded upstream + cached</text>

    <!-- step arrows (labels live in the caption below, to avoid covering the boxes) -->
    <path d="M270,212 L336,212" stroke="#22c55e" stroke-width="2" marker-end="url(#aLan)"/>
    <path d="M336,244 L272,244" stroke="#22c55e" stroke-width="2" marker-end="url(#aLan)"/>

    <text x="40" y="292" fill="#4ade80" font-size="10.5">① “what IP is tickvault.beonedge.internal?”</text>
    <text x="40" y="308" fill="#4ade80" font-size="10.5">② “192.168.29.2”  (the box itself)</text>
    <text x="40" y="324" fill="#4ade80" font-size="10.5">③ then HTTP straight to that IP, port 80</text>

    <!-- into nginx -->
    <path d="M270,336 C310,392 560,372 796,362" stroke="#22c55e" stroke-width="2.4" fill="none" marker-end="url(#aLan)"/>
    <text x="300" y="404" fill="#4ade80" font-size="10.5" font-family="monospace">Host: tickvault.beonedge.internal</text>
  </g>

  <!-- upstream resolver -->
  <rect x="340" y="322" width="300" height="66" rx="9" fill="#18181b" stroke="#52525b"/>
  <text x="356" y="342" fill="#d4d4d8" font-size="12" font-weight="700">Quad9 (DoH)  ·  upstream</text>
  <text x="356" y="360" fill="#8b8b93" font-size="10.5" font-family="monospace">https://dns.quad9.net/dns-query</text>
  <text x="356" y="379" fill="#71717a" font-size="10">public names only — *.internal never leaves the LAN</text>
  <path d="M400,307 L400,316" stroke="#71717a" stroke-width="1.6" marker-end="url(#aUp)"/>

  <!-- ================= PATH B: Tailscale ================= -->
  <g>
    <rect x="40" y="420" width="230" height="96" rx="10" fill="#0c1f2b" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="56" y="447" fill="#e0f2fe" font-size="15" font-weight="700">Your laptop</text>
    <text x="56" y="468" fill="#7dd3fc" font-size="12">anywhere (home Wi-Fi…)</text>
    <text x="56" y="489" fill="#38bdf8" font-size="10.5" font-family="monospace">/etc/hosts:</text>
    <text x="56" y="506" fill="#38bdf8" font-size="10.5" font-family="monospace">100.122.85.101 tickvault…</text>

    <rect x="340" y="420" width="300" height="96" rx="10" fill="#0c1f2b" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="356" y="447" fill="#e0f2fe" font-size="14" font-weight="700">Tailscale (WireGuard mesh)</text>
    <text x="356" y="468" fill="#7dd3fc" font-size="11.5">encrypted overlay — no ports opened,</text>
    <text x="356" y="486" fill="#7dd3fc" font-size="11.5">no public IP needed</text>
    <text x="356" y="506" fill="#38bdf8" font-size="10.5" font-family="monospace">tailscale0 · 100.122.85.101 : 80</text>

    <path d="M270,462 L336,462" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#aTs)"/>
    <path d="M640,470 C700,470 750,420 796,400" stroke="#38bdf8" stroke-width="2.4" fill="none" marker-end="url(#aTs)"/>
    <text x="654" y="446" fill="#7dd3fc" font-size="10.5" font-family="monospace">Host header unchanged</text>
  </g>

  <!-- ================= PATH C: Cloudflare (the OTHER site) ================= -->
  <g>
    <rect x="40" y="560" width="230" height="86" rx="10" fill="#2a1f06" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="56" y="587" fill="#fef3c7" font-size="15" font-weight="700">Internet visitor</text>
    <text x="56" y="609" fill="#fcd34d" font-size="12">public web</text>
    <text x="56" y="630" fill="#f59e0b" font-size="10.5" font-family="monospace">https://beus.beonedge.in</text>

    <rect x="340" y="545" width="300" height="118" rx="10" fill="#2a1f06" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="356" y="570" fill="#fef3c7" font-size="14" font-weight="700">Cloudflare edge + cloudflared</text>
    <text x="356" y="590" fill="#fcd34d" font-size="11.5">TLS ends here; tunnel is OUTBOUND</text>
    <text x="356" y="611" fill="#fbbf24" font-size="10.5" font-family="monospace">beus.beonedge.in → localhost:80</text>
    <text x="356" y="631" fill="#fbbf24" font-size="10.5" font-family="monospace">everything else → http_status:404</text>
    <text x="356" y="652" fill="#a1a1aa" font-size="10">↑ this line is why TickVault is NOT public</text>

    <path d="M270,590 L336,590" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#aCf)"/>
    <path d="M640,600 C710,600 760,520 796,470" stroke="#f59e0b" stroke-width="2.4" fill="none" marker-end="url(#aCf)"/>
  </g>

  <!-- ================= PATH D: SSH tunnel ================= -->
  <g>
    <rect x="40" y="690" width="230" height="96" rx="10" fill="#1e1533" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="56" y="717" fill="#ede9fe" font-size="15" font-weight="700">Your laptop</text>
    <text x="56" y="738" fill="#c4b5fd" font-size="12">SSH port-forward</text>
    <text x="56" y="759" fill="#a78bfa" font-size="10.5" font-family="monospace">-L 80:localhost:80</text>
    <text x="56" y="776" fill="#a78bfa" font-size="10.5" font-family="monospace">hosts: 127.0.0.1 tickvault…</text>

    <rect x="340" y="690" width="300" height="96" rx="10" fill="#1e1533" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="356" y="717" fill="#ede9fe" font-size="14" font-weight="700">sshd → loopback</text>
    <text x="356" y="738" fill="#c4b5fd" font-size="11.5">the hop emerges INSIDE the box,</text>
    <text x="356" y="756" fill="#c4b5fd" font-size="11.5">so it needs no firewall opening</text>
    <text x="356" y="777" fill="#a78bfa" font-size="10.5" font-family="monospace">127.0.0.1 : 80</text>

    <path d="M270,730 L336,730" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#aSsh)"/>
    <path d="M640,730 C710,730 760,560 796,505" stroke="#a78bfa" stroke-width="2.4" fill="none" marker-end="url(#aSsh)"/>
  </g>

  <!-- ================= NGINX ================= -->
  <rect x="800" y="185" width="330" height="420" rx="12" fill="#111827" stroke="#e4e4e7" stroke-width="2"/>
  <text x="820" y="214" fill="#f4f4f5" font-size="17" font-weight="700">nginx  ·  on the host</text>
  <text x="820" y="236" fill="#a1a1aa" font-size="11.5" font-family="monospace">listen 80  → 0.0.0.0 (every interface)</text>

  <rect x="818" y="252" width="294" height="60" rx="8" fill="#1f2937" stroke="#52525b"/>
  <text x="832" y="273" fill="#e4e4e7" font-size="11.5" font-weight="700">STEP 1 — pick the site by Host header</text>
  <text x="832" y="292" fill="#86efac" font-size="10.5" font-family="monospace">tickvault.beonedge.internal → this vhost</text>
  <text x="832" y="307" fill="#fbbf24" font-size="10.5" font-family="monospace">beus.beonedge.in → the other vhost</text>

  <text x="820" y="338" fill="#e4e4e7" font-size="11.5" font-weight="700">STEP 2 — pick the app by PATH</text>

  <rect x="818" y="348" width="294" height="34" rx="7" fill="#0b2a1a" stroke="#22c55e"/>
  <text x="832" y="370" fill="#a7f3d0" font-size="12" font-family="monospace">location /        → frontend:3789</text>

  <rect x="818" y="390" width="294" height="34" rx="7" fill="#0b2233" stroke="#38bdf8"/>
  <text x="832" y="412" fill="#bae6fd" font-size="12" font-family="monospace">location /api/    → backend:9000</text>

  <rect x="818" y="432" width="294" height="46" rx="7" fill="#2a1030" stroke="#e879f9"/>
  <text x="832" y="452" fill="#f5d0fe" font-size="12" font-family="monospace">location /ws/     → backend:9000</text>
  <text x="832" y="469" fill="#e879f9" font-size="10">+ Upgrade / Connection headers (WebSocket)</text>

  <rect x="818" y="492" width="294" height="98" rx="8" fill="#1c1917" stroke="#78716c"/>
  <text x="832" y="512" fill="#e7e5e4" font-size="11" font-weight="700">Why this matters — SAME ORIGIN</text>
  <text x="832" y="530" fill="#a8a29e" font-size="10.3">The browser only ever sees ONE origin, so the</text>
  <text x="832" y="545" fill="#a8a29e" font-size="10.3">JS just asks for /api and /ws — no CORS, and</text>
  <text x="832" y="560" fill="#a8a29e" font-size="10.3">no backend address baked into the bundle.</text>
  <text x="832" y="578" fill="#facc15" font-size="10.3">Rename the domain later → nothing to rebuild.</text>

  <!-- ================= DOCKER + CONTAINERS ================= -->
  <rect x="1160" y="185" width="340" height="420" rx="12" fill="none" stroke="#3f3f46" stroke-dasharray="6 4"/>
  <text x="1176" y="208" fill="#71717a" font-size="11.5" font-weight="700">docker network “data-downloader_default”</text>

  <rect x="1180" y="228" width="300" height="112" rx="10" fill="#0b2a1a" stroke="#22c55e" stroke-width="1.6"/>
  <text x="1196" y="253" fill="#dcfce7" font-size="14" font-weight="700">frontend  (Next.js)</text>
  <text x="1196" y="274" fill="#86efac" font-size="11" font-family="monospace">published 127.0.0.1:3789</text>
  <text x="1196" y="295" fill="#a1a1aa" font-size="10.5">serves the page + JS bundle only</text>
  <text x="1196" y="314" fill="#a1a1aa" font-size="10.5">NEXT_PUBLIC_BACKEND_URL is EMPTY</text>
  <text x="1196" y="331" fill="#4ade80" font-size="10.5">→ so the JS uses relative /api and /ws</text>

  <rect x="1180" y="360" width="300" height="130" rx="10" fill="#0b2233" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="1196" y="385" fill="#e0f2fe" font-size="14" font-weight="700">backend  (FastAPI)</text>
  <text x="1196" y="406" fill="#7dd3fc" font-size="11" font-family="monospace">published 127.0.0.1:9000</text>
  <text x="1196" y="427" fill="#a1a1aa" font-size="10.5">REST /api/*  +  WebSocket /ws/*</text>
  <text x="1196" y="446" fill="#a1a1aa" font-size="10.5">1 Hz capture → .bin files on disk</text>
  <text x="1196" y="465" fill="#fca5a5" font-size="10.5">checks Origin against FRONTEND_URL</text>
  <text x="1196" y="482" fill="#71717a" font-size="10">no public port — reachable only via nginx</text>

  <path d="M1130,365 L1176,290" stroke="#22c55e" stroke-width="2.2" fill="none" marker-end="url(#aLan)"/>
  <path d="M1130,407 L1176,415" stroke="#38bdf8" stroke-width="2.2" fill="none" marker-end="url(#aTs)"/>
  <path d="M1130,450 C1150,450 1160,440 1176,432" stroke="#e879f9" stroke-width="2.2" fill="none" marker-end="url(#aInt)"/>

  <rect x="1180" y="512" width="300" height="78" rx="10" fill="#18181b" stroke="#52525b"/>
  <text x="1196" y="534" fill="#d4d4d8" font-size="12" font-weight="700">Why 127.0.0.1 works here</text>
  <text x="1196" y="553" fill="#8b8b93" font-size="10.3">nginx runs on the HOST, and the containers</text>
  <text x="1196" y="568" fill="#8b8b93" font-size="10.3">publish to host loopback — so no container</text>
  <text x="1196" y="583" fill="#8b8b93" font-size="10.3">DNS is needed, and curl localhost:9000 still works.</text>

  <!-- ================= browser follow-up requests ================= -->
  <rect x="40" y="870" width="720" height="122" rx="11" fill="#101014" stroke="#3f3f46"/>
  <text x="58" y="896" fill="#f4f4f5" font-size="14" font-weight="700">What the BROWSER does after the page loads</text>
  <text x="58" y="920" fill="#a1a1aa" font-size="11.5">The page arrives, then its JavaScript makes its OWN calls — the browser talks to the backend directly:</text>
  <text x="58" y="944" fill="#bae6fd" font-size="11.5" font-family="monospace">fetch("/api/stats")            → same origin → nginx → backend:9000</text>
  <text x="58" y="964" fill="#f5d0fe" font-size="11.5" font-family="monospace">new WebSocket("ws://…/ws/market-data") → nginx upgrades → backend:9000</text>
  <text x="58" y="984" fill="#71717a" font-size="10.5">Relative URLs are the trick: they resolve against whatever host served the page, so any hostname just works.</text>

  <!-- ================= legend ================= -->
  <rect x="790" y="870" width="730" height="122" rx="11" fill="#101014" stroke="#3f3f46"/>
  <text x="808" y="896" fill="#f4f4f5" font-size="14" font-weight="700">The four routes in</text>

  <rect x="808" y="908" width="13" height="13" rx="3" fill="#22c55e"/>
  <text x="830" y="919" fill="#d4d4d8" font-size="11.3">Company LAN — AdGuard resolves the name, nginx serves it. Everyday use.</text>

  <rect x="808" y="930" width="13" height="13" rx="3" fill="#38bdf8"/>
  <text x="830" y="941" fill="#d4d4d8" font-size="11.3">Tailscale — works from anywhere; hosts file points the name at 100.122.85.101.</text>

  <rect x="808" y="952" width="13" height="13" rx="3" fill="#f59e0b"/>
  <text x="830" y="963" fill="#d4d4d8" font-size="11.3">Cloudflare tunnel — carries ONLY beus.beonedge.in; TickVault stays private.</text>

  <rect x="808" y="974" width="13" height="13" rx="3" fill="#a78bfa"/>
  <text x="830" y="985" fill="#d4d4d8" font-size="11.3">SSH tunnel — emerges on loopback inside the box, so no firewall hole is needed.</text>

  <text x="40" y="1026" fill="#52525b" font-size="10.5">
    Ports on the box: 53 = DNS (AdGuard) · 80 = HTTP (nginx) · 3789 / 9000 = app containers, loopback-only · 22 = SSH.
  </text>
  <text x="40" y="1046" fill="#52525b" font-size="10.5">
    Use http:// with NO port so the browser's Origin matches FRONTEND_URL exactly — otherwise the page loads but the WebSocket is refused.
  </text>
</svg>
